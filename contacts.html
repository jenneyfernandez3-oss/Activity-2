<!DOCTYPE html>    <__John Loyd Fodra</>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Send us your feedback and inquiries">
    <title>Contact - Team Web Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Web Systems & Technology Team Project</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact & Student Feedback</h1>

        <form action="#" method="POST">
            <p>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </p>

            <p>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </p>

            <p>
                <label>User Role:</label><br>
                <input type="radio" id="role-student" name="role" value="student">
                <label for="role-student">Student</label><br>
                <input type="radio" id="role-faculty" name="role" value="faculty">
                <label for="role-faculty">Faculty</label>
            </p>

            <p>
                <label>Interests:</label><br>
                <input type="checkbox" id="interest-web" name="interest" value="web">
                <label for="interest-web">Web Development</label><br>
                <input type="checkbox" id="interest-design" name="interest" value="design">
                <label for="interest-design">UI/UX Design</label><br>
                <input type="checkbox" id="interest-git" name="interest" value="git">
                <label for="interest-git">Git & GitHub</label>
            </p>

            <p>
                <label for="message">Your Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="40"></textarea>
            </p>

            <p>
                <label for="category">Subject Category:</label>
                <select id="category" name="category">
                    <option value="general">General Inquiry</option>
                    <option value="feedback">Feedback</option>
                    <option value="assistance">Technical Assistance</option>
                    <option value="collaboration">Collaboration</option>
                </select>
            </p>

            <p>
                <button type="submit">Submit Form</button>
                <button type="reset">Clear Form</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 BSIT 1 — Occidental Mindoro State University. All rights reserved.</p>
    </footer>
</body>
</html>
